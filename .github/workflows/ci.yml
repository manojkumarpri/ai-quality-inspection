name: CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quality_inspection_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # --- 1. Install Dependencies ---
      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      # --- 2. Quality Gates: Frontend ---
      - name: Frontend Type Check
        run: npm run typecheck --prefix frontend

      - name: Frontend Lint
        run: npm run lint --prefix frontend

      # --- 3. Quality Gates: Backend ---
      - name: Backend Type Check
        run: npm run typecheck --prefix backend

      - name: Backend Lint
        run: npm run lint --prefix backend

      - name: Backend Unit Tests
        run: npm run test --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/quality_inspection_db?schema=public